apiVersion: v1
kind: Service

metadata:
  name: {{ include "golden-path-service.fullname" . }}
  labels:
    {{- include "golden-path-service.labels" . | nindent 4 }}
    backstage.io/kubernetes-id: {{ .Values.backstage.kubernetesId | quote }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "golden-path-service.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
