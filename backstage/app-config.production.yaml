app:
  baseUrl: https://backstage.kapilkumaria.com

backend:
  baseUrl: https://backstage.kapilkumaria.com
  listen: ':7007'

  cors:
    origin: https://backstage.kapilkumaria.com
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}
      ssl:
        rejectUnauthorized: false

      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

auth:
  environment: production

  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}

        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

catalog:
  locations:
    - type: file
      target: ./catalog/org.yaml
      rules:
        - allow: [User, Group]

    - type: file
      target: ./catalog/platform.yaml
      rules:
        - allow: [Domain, System]

    - type: url
      target: https://github.com/kapilkumaria/enterprise-internal-developer-platform/blob/main/catalog-info.yaml
      rules:
        - allow: [Component]

    - type: file
      target: ./catalog/resources.yaml
      rules:
        - allow: [Resource]

    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

kubernetes:
  serviceLocatorMethod:
    type: multiTenant

  clusterLocatorMethods:
    - type: config
      clusters:
        - name: enterprise-idp-dev
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          skipTLSVerify: false
          skipMetricsLookup: true
