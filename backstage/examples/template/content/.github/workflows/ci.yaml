name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::931058976119:role/enterprise-idp-dev-github-actions-role
  ECR_REPOSITORY: enterprise-idp/services/idp-golden-path-demo
  SERVICE_NAME: ${{ '${{ github.event.repository.name }}' }}

jobs:
  validate:
    name: Validate Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials with OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ '${{ env.AWS_ROLE_ARN }}' }}
          aws-region: ${{ '${{ env.AWS_REGION }}' }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build container
        run: docker build -t "${SERVICE_NAME}:${GITHUB_SHA}" .

      - name: Tag container for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            "${SERVICE_NAME}:${GITHUB_SHA}" \
            ${ECR_URL}:sha-${GITHUB_SHA}
        env:
          ECR_URL: ${{ '${{ steps.login-ecr.outputs.registry }}' }}/${{ '${{ env.ECR_REPOSITORY }}' }}

      - name: Push container to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ${ECR_URL}:sha-${GITHUB_SHA}
        env:
          ECR_URL: ${{ '${{ steps.login-ecr.outputs.registry }}' }}/${{ '${{ env.ECR_REPOSITORY }}' }}
