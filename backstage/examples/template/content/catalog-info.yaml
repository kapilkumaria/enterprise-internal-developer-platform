apiVersion: backstage.io/v1alpha1
kind: Component

metadata:
  name: ${{ values.name | dump }}
  title: ${{ values.name | dump }}
  description: ${{ values.description | dump }}

  annotations:
    backstage.io/techdocs-ref: dir:.

  tags:
    - nodejs
    - docker
    - kubernetes
