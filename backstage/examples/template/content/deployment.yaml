apiVersion: apps/v1
kind: Deployment

metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    backstage.io/kubernetes-id: ${{ values.name }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.name }}
        backstage.io/kubernetes-id: ${{ values.name }}

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: ${{ values.name }}
          image: REPLACE_WITH_IMAGE
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
