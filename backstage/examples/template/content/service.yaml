apiVersion: v1
kind: Service

metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    backstage.io/kubernetes-id: ${{ values.name }}

spec:
  selector:
    app.kubernetes.io/name: ${{ values.name }}

  ports:
    - name: http
      port: 3000
      targetPort: http

  type: ClusterIP
