apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: enterprise-nodejs-service
  title: Enterprise Node.js Service
  description: Create a production-ready Node.js service using the Enterprise Internal Developer Platform golden path
  tags:
    - recommended
    - nodejs
    - docker
    - kubernetes
    - platform-engineering

spec:
  owner: group:default/platform-engineering
  type: service

  parameters:
    - title: Service Information
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service Name
          type: string
          description: Unique lowercase name for the service
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          ui:field: EntityNamePicker
          ui:autofocus: true

        description:
          title: Description
          type: string
          description: Short description of the service

        owner:
          title: Owner
          type: string
          description: Team responsible for this service
          default: group:default/platform-engineering
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub Repository
          type: string
          description: Select the GitHub owner and repository name
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - kapilkumaria

  steps:
    - id: fetchBase
      name: Generate Service
      action: fetch:template
      input:
        url: ./content

        # GitHub Actions uses the same ${{ ... }} expression syntax as
        # Backstage Scaffolder. Preserve workflow files verbatim so that
        # GitHub evaluates its own expressions after repository creation.
        copyWithoutRender:
          - .github/workflows/*

        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Create GitHub Repository
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register in Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    - id: notify
      name: Notify Developer
      action: notification:send
      input:
        recipients: entity
        entityRefs:
          - user:default/kapilkumaria
        title: Service created
        info: '${{ parameters.name }} was created and registered in the software catalog.'
        severity: normal

  output:
    links:
      - title: GitHub Repository
        url: ${{ steps.publish.output.remoteUrl }}

      - title: Open in Software Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
