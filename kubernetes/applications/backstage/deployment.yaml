apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: developer-portal
    backstage.io/kubernetes-id: backstage

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: backstage

  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
        app.kubernetes.io/component: developer-portal
        backstage.io/kubernetes-id: backstage

    spec:
      serviceAccountName: backstage

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backstage
          image: 931058976119.dkr.ecr.us-east-1.amazonaws.com/enterprise-idp/backstage:sha-023b92d-amd64
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 7007
              protocol: TCP

          envFrom:
            - configMapRef:
                name: backstage-postgres

            - secretRef:
                name: backstage-postgres

            - secretRef:
                name: backstage-github-oauth

            - secretRef:
                name: backstage-github-integration

          env:
            - name: NODE_ENV
              value: production

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: "1"
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
