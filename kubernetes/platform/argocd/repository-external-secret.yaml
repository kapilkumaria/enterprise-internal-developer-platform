apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: enterprise-idp-repository
  namespace: argocd

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: enterprise-idp-repository
    creationPolicy: Owner

    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository

      type: Opaque

      data:
        type: git
        url: https://github.com/kapilkumaria/enterprise-internal-developer-platform.git
        username: "{{ .username }}"
        password: "{{ .token }}"

  data:
    - secretKey: username
      remoteRef:
        key: enterprise-idp/dev/argocd-github
        property: username

    - secretKey: token
      remoteRef:
        key: enterprise-idp/dev/argocd-github
        property: token
