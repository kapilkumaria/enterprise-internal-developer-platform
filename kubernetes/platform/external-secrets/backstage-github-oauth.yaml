apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-github-oauth
  namespace: backstage

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: backstage-github-oauth
    creationPolicy: Owner

  data:
    - secretKey: AUTH_GITHUB_CLIENT_ID
      remoteRef:
        key: enterprise-idp/dev/backstage-github-oauth
        property: clientId

    - secretKey: AUTH_GITHUB_CLIENT_SECRET
      remoteRef:
        key: enterprise-idp/dev/backstage-github-oauth
        property: clientSecret
