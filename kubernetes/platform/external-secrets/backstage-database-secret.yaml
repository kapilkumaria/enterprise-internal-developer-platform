apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-database
  namespace: backstage
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: backstage-postgres
    creationPolicy: Owner

  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:931058976119:secret:rds!db-5d2458ab-4891-42cb-a086-77fee337b7a1-gMrust
        property: username

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:931058976119:secret:rds!db-5d2458ab-4891-42cb-a086-77fee337b7a1-gMrust
        property: password
