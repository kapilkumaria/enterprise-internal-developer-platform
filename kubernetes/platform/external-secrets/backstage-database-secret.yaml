apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: backstage-database
  namespace: backstage

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: backstage-postgres
    creationPolicy: Owner

    template:
      engineVersion: v2
      type: Opaque

      templateFrom:
        - literal: |
            {{- range $key, $value := . }}
            {{- $credentials := $value | fromJson }}
            POSTGRES_USER: {{ $credentials.username }}
            POSTGRES_PASSWORD: {{ $credentials.password }}
            {{- end }}

  dataFrom:
    - find:
        tags:
          Project: enterprise-idp
          Environment: dev
          Name: enterprise-idp-dev-postgres
