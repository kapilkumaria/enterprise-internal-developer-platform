apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-database
  namespace: backstage
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: backstage-postgres
    creationPolicy: Owner

  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:931058976119:secret:rds!db-5b9b7fd1-7660-4073-b109-cd43e62e9706-w8mENf
        property: username

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:931058976119:secret:rds!db-5b9b7fd1-7660-4073-b109-cd43e62e9706-w8mENf
        property: password
